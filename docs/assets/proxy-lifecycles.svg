<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 438" role="img" aria-labelledby="title desc">
  <title id="title">Three proxy lifecycles</title>
  <desc id="desc">Async proxies queue calls until attachment. Event proxies notify current listeners without replay. Registering proxies retain entries and replay them to replacement providers.</desc>
  <rect width="480" height="438" rx="16" fill="#f5f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#172b45">
    <text x="24" y="36" font-size="20" font-weight="700">What survives a missing attachment?</text>
    <rect x="24" y="58" width="432" height="102" rx="10" fill="#e1ecfa"/>
    <text x="42" y="88" font-size="18" font-weight="700">AsyncProxy · ask for a result</text>
    <text x="42" y="119" font-size="16">Call → bounded queue → provider attaches</text>
    <text x="42" y="144" font-size="16">Pending calls run and resolve or reject.</text>
    <rect x="24" y="178" width="432" height="102" rx="10" fill="#eee6fb"/>
    <text x="42" y="208" font-size="18" font-weight="700">EventProxy · notify now</text>
    <text x="42" y="239" font-size="16">Emit → current listeners</text>
    <text x="42" y="264" font-size="16">No queue. New listeners do not receive history.</text>
    <rect x="24" y="298" width="432" height="102" rx="10" fill="#d9eee8"/>
    <text x="42" y="328" font-size="18" font-weight="700">RegisteringProxy · retain declarations</text>
    <text x="42" y="359" font-size="16">Register → stored entry → attach → replay</text>
    <text x="42" y="384" font-size="16">Provider replacement can replay entries again.</text>
    <text x="24" y="424" font-size="13">Normal runtime behavior; test stub mode rejects missing providers.</text>
  </g>
</svg>
