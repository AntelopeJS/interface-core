name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@ci/gardener-ci-pieces
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json

  checks:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
